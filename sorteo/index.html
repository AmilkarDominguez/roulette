<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo · Tarija Tech Week</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<!-- ============ PANTALLA DE SORTEO ============ -->
<main id="drawView" class="view">
    <header class="topbar">
        <div class="brand">
            <span class="brand-title" id="eventTitle">Tarija Tech Week</span>
            <span class="brand-sub">Gran sorteo de cierre</span>
        </div>
        <div class="toolbar">
            <button class="icon-btn" id="btnWinners" title="Ganadores (G)">🏆</button>
            <button class="icon-btn" id="btnSound" title="Sonido (S)">🔊</button>
            <button class="icon-btn" id="btnFullscreen" title="Pantalla completa (F)">⛶</button>
            <button class="icon-btn" id="btnSettings" title="Configuración (C)">⚙️</button>
        </div>
    </header>

    <section class="stage">
        <div class="prize-banner">
            <div class="prize-count" id="prizeCount">Premio 1 de 10</div>
            <div class="prize-name" id="prizeName">—</div>
        </div>

        <div class="number-wrap" id="numberWrap">
            <div class="reels" id="reels"></div>
            <div class="winner-label" id="winnerLabel">&nbsp;</div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="btnDraw">SORTEAR</button>
            <button class="btn btn-ghost hidden" id="btnVoid" title="El ganador no está presente: se anula y se vuelve a sortear el mismo premio">Ausente · volver a sortear</button>
            <button class="btn btn-ghost hidden" id="btnNext">Siguiente premio ➜</button>
        </div>
        <div class="hint" id="hint">Pulsa <kbd>Espacio</kbd> para sortear</div>
    </section>

    <aside class="winners-panel" id="winnersPanel">
        <div class="panel-head">
            <h2>Ganadores</h2>
            <button class="icon-btn small" id="btnCloseWinners">✕</button>
        </div>
        <ol class="winners-list" id="winnersList"></ol>
        <div class="panel-foot">
            <span id="poolInfo"></span>
            <button class="btn btn-small" id="btnExport">Exportar CSV</button>
        </div>
    </aside>
</main>

<!-- ============ PANTALLA FINAL ============ -->
<section id="finishView" class="overlay hidden">
    <div class="finish-card">
        <h1>¡Sorteo finalizado!</h1>
        <p class="muted">Gracias por ser parte de <strong id="finishTitle">Tarija Tech Week</strong></p>
        <ol class="winners-list big" id="finishList"></ol>
        <div class="row">
            <button class="btn btn-small" id="btnFinishExport">Exportar CSV</button>
            <button class="btn btn-small btn-ghost" id="btnFinishClose">Cerrar</button>
        </div>
    </div>
</section>

<!-- ============ CONFIGURACIÓN ============ -->
<section id="settingsView" class="overlay hidden">
    <form class="settings-card" id="settingsForm" autocomplete="off">
        <h1>Configuración del sorteo</h1>

        <label class="field">
            <span>Nombre del evento</span>
            <input type="text" id="cfgTitle" required>
        </label>

        <div class="grid2">
            <label class="field">
                <span>Número mínimo</span>
                <input type="number" id="cfgMin" required step="1">
            </label>
            <label class="field">
                <span>Número máximo</span>
                <input type="number" id="cfgMax" required step="1">
            </label>
        </div>

        <label class="field">
            <span>Premios <small>(uno por línea, en el orden en que se sortean. Usa <code>x3</code> para repetir: <code>Polera x3</code>)</small></span>
            <textarea id="cfgPrizes" rows="8" required></textarea>
        </label>

        <label class="field">
            <span>Números excluidos <small>(opcional, ej.: <code>13, 100-110</code>)</small></span>
            <input type="text" id="cfgExcluded" placeholder="Ninguno">
        </label>

        <div class="grid2">
            <label class="field">
                <span>Duración de la animación (segundos)</span>
                <input type="number" id="cfgDuration" min="1" max="20" step="0.5" required>
            </label>
            <div class="checks">
                <label class="check"><input type="checkbox" id="cfgNoRepeat"> Un número no puede ganar dos veces</label>
                <label class="check"><input type="checkbox" id="cfgSound"> Sonido</label>
            </div>
        </div>

        <p class="muted small" id="cfgSummary"></p>
        <p class="error" id="cfgError"></p>

        <div class="row">
            <button type="submit" class="btn btn-primary btn-small">Guardar e ir al sorteo</button>
            <button type="button" class="btn btn-small btn-ghost" id="btnCancelSettings">Cancelar</button>
            <span class="spacer"></span>
            <button type="button" class="btn btn-small btn-danger" id="btnReset">Reiniciar sorteo</button>
        </div>
        <p class="muted small" id="drawsInfo"></p>
    </form>
</section>

<script src="app.js" defer></script>
</body>
</html>
